name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  release:
    name: Build APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build & test web assets
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        id: build_apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-dev}"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/messpass-release.jks
            export KEYSTORE_FILE="../messpass-release.jks"
            (cd android && ./gradlew assembleRelease)
            APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
            APK_OUT="MessPass-${TAG_NAME}.apk"
            cp "$APK_SRC" "$APK_OUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            (cd android && ./gradlew assembleDebug)
            APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
            APK_OUT="MessPass-${TAG_NAME}-debug.apk"
            cp "$APK_SRC" "$APK_OUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "apk_path=$APK_OUT" >> "$GITHUB_OUTPUT"

      - name: Verify release APK signature
        if: steps.build_apk.outputs.signed == 'true'
        run: npm run android:verify

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.build_apk.outputs.apk_path }}
