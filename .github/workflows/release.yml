name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build & test web assets
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Set up JDK 21
        if: "!contains(github.ref_name, '-web')"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        if: "!contains(github.ref_name, '-web')"
        run: npx cap sync android

      - name: Build Android APK
        id: build_apk
        if: "!contains(github.ref_name, '-web')"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          VER_NAME="${TAG_NAME#v}"
          VER_NAME="${VER_NAME%-app}"
          VER_NAME="${VER_NAME%-web}"

          if [[ "$VER_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            if [[ "$VER_NAME" == *"-beta"* ]]; then
              BETA_NUM=0
              if [[ "$VER_NAME" =~ beta\.?([0-9]+) ]]; then
                BETA_NUM="${BASH_REMATCH[1]}"
              fi
              PRE_OFFSET=$(( BETA_NUM < 98 ? BETA_NUM : 98 ))
            else
              PRE_OFFSET=99
            fi
            VER_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + PRE_OFFSET ))
          else
            VER_CODE="${GITHUB_RUN_NUMBER:-1}"
          fi

          export APP_VERSION_NAME="$VER_NAME"
          export APP_VERSION_CODE="$VER_CODE"
          echo "Building Android versionName=$APP_VERSION_NAME versionCode=$APP_VERSION_CODE"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/messpass-release.jks
            export KEYSTORE_FILE="../messpass-release.jks"
            (cd android && ./gradlew assembleRelease)
            APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
            APK_OUT="MessPass-${TAG_NAME}.apk"
            cp "$APK_SRC" "$APK_OUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            (cd android && ./gradlew assembleDebug)
            APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
            APK_OUT="MessPass-${TAG_NAME}-debug.apk"
            cp "$APK_SRC" "$APK_OUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "apk_path=$APK_OUT" >> "$GITHUB_OUTPUT"

      - name: Verify release APK signature
        if: "!contains(github.ref_name, '-web') && steps.build_apk.outputs.signed == 'true'"
        run: npm run android:verify

      - name: Create GitHub Release
        if: "startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-web')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="${{ steps.build_apk.outputs.apk_path }}"
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *"-beta"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --generate-notes --title "$TAG" $PRERELEASE_FLAG
          fi

      - name: Deploy to Cloudflare
        if: "startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-app')"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN not set; skipping Cloudflare deploy."
          fi
